# Project configuration. Relative paths resolve against the repo root.
# Copy this file to try another region or year pair, then pass it with --config.

earth_engine:
  project: skilled-bonus-455612-j3
  hansen_asset: UMD/hansen/global_forest_change_2025_v1_13

region:
  name: sao_felix_do_xingu
  # Degrees, WGS84 (EPSG:4326).
  bbox:
    west: -52.5
    south: -7.0
    east: -51.5
    north: -6.0

# Test area for the pipeline: the quarter of the region with the most 2021 loss.
subset:
  name: ne_quarter
  bbox:
    west: -52.0
    south: -6.5
    east: -51.5
    north: -6.0

years:
  before: 2020
  after: 2022

# Composite window, inclusive of both months, applied to each year.
season:
  start_month: 6
  end_month: 9

composite:
  # Skips the cloudiest scenes before masking, which saves Earth Engine compute.
  s2_max_cloud_percent: 60

export:
  crs: EPSG:32722        # UTM 22S, so pixels have true metric area for hectares
  scale_m: 10
  drive_folder: deforestation_phase1
  file_dimensions: 2560  # pixels per output file side

labels:
  forest_min_treecover: 50  # percent tree cover in 2000 that counts as forest

patch:
  size: 256    # pixels per side; must be divisible by 32 for U-Net style encoders
  stride: 256  # equal to size means no overlap between patches
  max_nodata_fraction: 0.05  # patches with more missing imagery are skipped

# North-to-south stripes, cut so each split holds this share of the loss pixels.
split:
  train: 0.70
  val: 0.15
  test: 0.15
  buffer_m: 2560  # minimum gap between splits, so neighbouring pixels cannot leak

paths:
  raw_dir: data/raw          # GeoTIFF tiles exported from Earth Engine
  patches_dir: data/patches  # model-ready patches and their metadata
  outputs_dir: outputs       # checkpoints, metrics, figures
